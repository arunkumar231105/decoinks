# The shop runs on Pakistan time. These tests fail if anything slips back to
# UTC days — the dashboard disagreeing with the CRM, or payments between
# midnight and 05:00 in Pakistan booked on the previous date.
name: Shop time (Pakistan days)

on:
  push:
  pull_request:

jobs:
  shop-time:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx jest tests/unit/shop-time.test.js tests/unit/zelle-email.test.js --runInBand
