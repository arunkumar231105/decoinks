server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The page shell must never be served stale: after a deploy the browser has to
  # fetch the new index.html, or it keeps asking for bundles that no longer exist
  # and shows the old portal until someone hard-refreshes.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Vite fingerprints every bundle name, so these can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to backend container.
  #
  # The upstream goes through a variable on purpose: with a literal host nginx
  # resolves "backend" once at startup and caches that IP, so every backend
  # rebuild gave the portal a 502 until nginx was restarted too. A variable
  # forces resolution per request via Docker's embedded DNS.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://decoinks_backend:8000;
    proxy_pass         $backend_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_cache_bypass $http_upgrade;
    client_max_body_size 20m;
  }
}
