server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Every path renders the app; the token is read from the URL. /pay/<token>
  # and a bare /<token> both work, so the address can be shortened later
  # without breaking links already in customers' hands.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Apple Pay verifies a domain by fetching this exact path. It must be served
  # as a plain file with no SPA fallback — the HTML fallback would look to
  # Apple like a failed verification.
  location = /.well-known/apple-developer-merchantid-domain-association {
    default_type text/plain;
    try_files /.well-known/apple-developer-merchantid-domain-association =404;
  }

  # Same resolver-through-a-variable trick the other portals use: a literal
  # hostname is resolved once at start-up, so every backend rebuild would 502
  # this app until nginx restarted too.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    # The unique container name, never the shared "backend" alias — that alias
    # is also claimed by other apps on this network and round-robins to them.
    set $backend_api http://decoinks_backend:8000;
    proxy_pass         $backend_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }
}
