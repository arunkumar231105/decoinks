server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin artwork files (MinIO). Mirrors the main app so customer-portal
  # <img src="/storage/..."> previews resolve without cross-origin/mixed-content
  # issues. Resolver-based upstream so a MinIO restart doesn't 502 the portal.
  location ^~ /storage/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $minio_storage http://minio:9000;
    rewrite ^/storage/(.*)$ /$1 break;
    proxy_pass         $minio_storage;
    proxy_set_header   Host $host;
  }

  # Proxy API calls to backend container.
  #
  # The upstream goes through a variable on purpose: with a literal host nginx
  # resolves "backend" once at startup and caches that IP, so every backend
  # rebuild gave the portal a 502 until nginx was restarted too. A variable
  # forces resolution per request via Docker's embedded DNS.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Unique container name, NOT the ambiguous "backend" alias: shipping_app_backend
    # and blanktex-backend-1 share the decoinks network AND the "backend" alias, so
    # "backend" round-robins to the wrong app ("No route for POST ..."). See suite
    # docker hostname collisions.
    set $backend_api http://decoinks_backend:8000;
    proxy_pass         $backend_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_cache_bypass $http_upgrade;
    client_max_body_size 20m;
  }
}
